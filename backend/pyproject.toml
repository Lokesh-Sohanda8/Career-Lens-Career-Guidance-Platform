[project]

name = "careerlens-backend"
version = "0.1.0"
description = "CareerLens modular monolith backend"
requires-python = ">=3.11,<3.14"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "httpx>=0.27,<1.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]

dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.25,<1.0",
    "httpx>=0.28,<1.0",
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "pre-commit>=4.0,<5.0",
]

[tool.pytest.ini_options]

pythonpath = ["."]
markers = [
    "integration: tests that require integration infrastructure",
]

[tool.ruff]

line-length = 100
target-version = "py311"

[tool.ruff.lint]

select = ["E", "F", "I", "B", "UP"]

[tool.mypy]

python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true